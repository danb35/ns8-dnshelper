name: "Clean up API JSON Schema docs"

on:
  delete:

# The called workflow deletes the apidoc-<branch> branch, so it needs write access; a
# reusable workflow cannot get more than its caller grants (see build-apidoc.yml).
permissions:
  contents: write

jobs:
  build-apidoc:
    name: "Delete apidoc branch ${{ github.event.ref }}"
    uses: NethServer/ns8-github-actions/.github/workflows/clean-apidoc.yml@v1
