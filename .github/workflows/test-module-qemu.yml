name: "Test module on QEMU"

# Boots throwaway NS8 nodes (Rocky 9 and Debian 13) on the runner and runs
# tests/ against the image just published, so the module is tested without any
# external infrastructure. Chained on the build: a broken image never reaches
# the test. Same wrapper and settings as ns8-powerdns.
# Inputs: https://github.com/NethServer/ns8-github-actions/blob/v1/docs/test-module-qemu.md#inputs

# The run belongs to the default branch under workflow_run: name the tested one.
run-name: "Test ${{ github.event.workflow_run.head_branch || github.ref_name }} on QEMU"

on:
  workflow_run:
    workflows: ["Publish images"]
    types: [completed]
  workflow_dispatch:
    inputs:
      debug_shell:
        description: "Open a tmate shell when the suite fails"
        required: false
        default: false
        type: boolean
      ui_tests:
        description: "Run the cases tagged ui and publish their screenshots"
        required: false
        default: false
        type: boolean

jobs:
  run:
    name: "Run tests"
    # Granted on this job only, not by raising the repository default:
    # statuses (one per leg on the pull request; required), contents (the
    # screenshots go to the ci-screenshots branch) and pull-requests (the
    # comment linking them).
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    uses: NethServer/ns8-github-actions/.github/workflows/test-module-qemu.yml@v1
    with:
      # Screenshots when ui/ or build-images.sh changed, Renovate's PRs included.
      ui_tests_strategy: ${{ github.event.inputs.ui_tests == 'true' && 'always' || 'on_ui_change' }}
      debug_shell: ${{ github.event.inputs.debug_shell == 'true' }}
