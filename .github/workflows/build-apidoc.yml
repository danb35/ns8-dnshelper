name: "Build API JSON Schema docs"

on:
  push:
    paths:
      - '**/validate-input.json'
      - '**/validate-output.json'
      - '**/validator-definitions.json'
  workflow_dispatch:

# The called workflow pushes the generated docs to an apidoc-<branch> branch, so it needs
# write access. A reusable workflow cannot get more than its caller grants, and the default
# token of a repository is read-only: without this the run fails at startup.
permissions:
  contents: write

jobs:
  build-apidoc:
    uses: NethServer/ns8-github-actions/.github/workflows/build-apidoc.yml@v1
